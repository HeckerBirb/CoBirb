[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobirb"
version = "0.1.0"
description = "A privacy-first, Copilot-like agentic CLI. Noah the African Grey parrot lives in your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "copilot", "cli", "agent", "privacy", "llm", "ollama"]
authors = [{ name = "Birb" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

# Runtime dependencies are intentionally minimal so the core stays thin and local-only.
# `cryptography` backs the default (core) SessionCrypto plugin; it is vetted, not
# hand-rolled crypto, and is required because HybridPQCSessionCrypto ships as a
# built-in core plugin rather than an opt-in extra.
dependencies = [
    "rich>=13.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# These are NOT required for the core. They are provided by plugins when needed.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
cobirb = "cobirb.cli:main"

# Plugin entry-point groups declared in the Plugin SPI.
# Plugins declare implementations here under [project.entry-points."cobirb.plugins"].
[project.entry-points."cobirb.plugins"]
# Core ships these built-in plugins (always available).
core-tools = "cobirb.plugins.core.tools:ToolRegistry"
core-model = "cobirb.plugins.core.model:LocalModelProvider"
core-io = "cobirb.plugins.core.io:TerminalIO"
core-crypto = "cobirb.plugins.core.crypto:HybridPQCSessionCrypto"
core-persona = "cobirb.plugins.core.persona:NoahPersona"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobirb"
version = "0.27.1"
description = "A privacy-first, agentic coding CLI. Noah the African Grey parrot lives in your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "coding", "cli", "agent", "privacy", "llm", "ollama"]
authors = [{ name = "Birb" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

# Runtime dependencies are kept few and deliberate: each one is a decision,
# not a convenience. All of them are local-only — no network client, no
# telemetry, and no compiled extension beyond the one `cryptography` needs.
# `cryptography` backs the default (core) SessionCrypto plugin; it is vetted, not
# hand-rolled crypto, and is required because AesGcmScryptSessionCrypto ships as a
# built-in core plugin rather than an opt-in extra.
# `textual` powers interactive mode's full-screen app (see cobirb/tui/). This is
# an accepted, explicit exception to the older "keep dependencies minimal" line:
# matching the intended interactive experience — a persistent tab bar, fixed
# layout regions, a boxed input, modal tool approval — needs a real TUI
# framework, not more `rich` polish. It shares `rich` (already required), adds
# no compiled extension, and is imported lazily, so one-shot/programmatic mode
# never loads it.
dependencies = [
    "rich>=13.7",
    "cryptography>=42.0",
    "textual>=1.0",
]

[project.optional-dependencies]
# These are NOT required for the core. They are provided by plugins when needed.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Textual's App.run_test()/Pilot harness is async, so the TUI suite needs
    # an asyncio-aware runner.
    "pytest-asyncio>=0.24",
]

[project.scripts]
cobirb = "cobirb.cli:main"

# Plugin entry-point groups declared in the Plugin SPI.
# Plugins declare implementations here under [project.entry-points."cobirb.plugins"].
[project.entry-points."cobirb.plugins"]
# Core ships these built-in plugins (always available).
core-tools = "cobirb.plugins.core.tools:ToolRegistry"
core-model = "cobirb.plugins.core.model:LocalModelProvider"
core-io = "cobirb.plugins.core.io:TerminalIO"
core-crypto = "cobirb.plugins.core.crypto:AesGcmScryptSessionCrypto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed (PEP 561) declares that this package ships inline type hints a
# consuming project's type checker should read, rather than treating cobirb
# as untyped.
# tui/*.tcss is the Textual stylesheet the interactive app loads at runtime via
# CSS_PATH — without it listed here, an installed (non-editable) CoBirb starts
# interactive mode and immediately fails to find its own layout.
# install.sh ships inside the package so a managed install carries the script
# that manages it: `--upgrade` runs the copy belonging to the version it is
# running, rather than fetching one and hoping the two agree.
cobirb = ["py.typed", "tui/*.tcss", "install.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/test_tui.py drives the app through Textual's async Pilot harness;
# "auto" lets those `async def test_...` functions run without each needing its
# own @pytest.mark.asyncio decoration.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: hits a real local Ollama server; skipped unless COBIRB_TEST_MODEL is set (see tests/test_integration_ollama.py)",
]
